<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress to Impress</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background: #ffd6e7; }
.container { max-width: 1200px; margin: 20px auto; background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(255,105,180,0.3); }
h1 { text-align: center; color: #ff1493; }
.game { display: flex; gap: 20px; }
.sidebar, .right { width: 250px; }
.main { flex: 1; text-align: center; }
.character { max-width: 100%; height: 500px; object-fit: contain; border-radius: 15px; border: 5px solid #ff69b4; }
button { display: block; width: 100%; margin: 8px 0; padding: 12px; background: #ff69b4; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; }
button:hover { background: #ff1493; }
button.active { background: #da70d6; }
#theme { font-size: 20px; font-weight: bold; color: #c71585; padding: 10px; background: #fff0f5; border-radius: 10px; }
#score { font-size: 24px; color: #ff1493; }
.message { margin-top: 10px; font-size: 18px; color: #c71585; min-height: 30px; }
</style>
</head>
<body>
<div class="container">
  <h1>✨ DRESS TO IMPRESS ✨</h1>
  <div class="game">
    <div class="sidebar">
      <h3>Your Theme</h3>
      <div id="theme">Enchanted Evening</div>
      <button onclick="changeTheme()">Get a New Theme</button>
      <h3>Choose Your Look</h3>
      <button class="active" onclick="changeOutfit(0, this)">Pink Ballgown</button>
      <button onclick="changeOutfit(1, this)">Black Mini</button>
      <button onclick="changeOutfit(2, this)">Enchanted Trio</button>
    </div>
    <div class="main">
      <img id="char" class="character" src="1aaPM.jpg" alt="Your model">
      <div id="score">Your Score: --</div>
      <div class="message" id="message">Pick a look and strut the runway!</div>
      <button onclick="poseAndScore()">You Pose on the Runway</button>
    </div>
    <div class="right">
      <h3>Leaderboard</h3>
      <p>You: <span id="you">0</span></p>
      <p>LillyGrace: 88</p>
      <p>SkylerB: 76</p>
      <button onclick="newRound()">Start a New Round</button>
    </div>
  </div>
</div>
<script>
const outfits = [
  {src: "1aaPM.jpg", base: 92, name: "Pink Ballgown"},
  {src: "M4yYJ.jpg", base: 85, name: "Black Mini"},
  {src: "zRFl9.jpg", base: 88, name: "Enchanted Trio"}
];
const themes = ["Enchanted Evening", "Gothic Romance", "Beach Party", "Red Carpet", "Halloween", "Fairy Tale", "Alien Royalty"];
let current = 0;
function changeOutfit(i, btn) {
  current = i;
  document.getElementById("char").src = outfits[i].src;
  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("message").textContent = "You chose the " + outfits[i].name + " look!";
}
function changeTheme() {
  const theme = themes[Math.floor(Math.random()*themes.length)];
  document.getElementById("theme").textContent = theme;
  document.getElementById("message").textContent = "Your new theme is: " + theme + ". Dress to match!";
}
function poseAndScore() {
  const score = outfits[current].base + Math.floor(Math.random()*12);
  document.getElementById("score").textContent = "Your Score: " + score;
  document.getElementById("you").textContent = score;
  const msg = score > 90 ? "You slayed the runway! 👑" : score > 80 ? "You look amazing! ✨" : "Cute look — keep styling!";
  document.getElementById("message").textContent = msg;
  alert(msg);
}
function newRound() {
  document.getElementById("score").textContent = "Your Score: --";
  document.getElementById("you").textContent = "0";
  document.getElementById("message").textContent = "New round started. Choose your look!";
  changeTheme();
}
</script>
</body>
</html>
